<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <title>CleanSpace: Photo Cleaner — iPhone Storage &amp; Duplicates</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Runs before the first paint: the prerendered HTML carries no theme, so a
       visitor who chose light while their OS is dark would otherwise see a dark
       flash until Angular boots. Deliberately inline and synchronous. -->
  <script>
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>

  <!-- Primary meta -->
  <meta name="description" content="CleanSpace — منظّف مساحة ذكي وآمن لجهازك. يكتشف الصور المكررة والمتشابهة، يضغط الفيديو، وكل المعالجة على جهازك. A smart, private storage cleaner: find duplicate & similar photos, compress videos, merge contacts — all processed on-device.">
  <meta name="keywords" content="CleanSpace, storage cleaner, duplicate photos, similar photos, video compression, iPhone cleaner, private, on-device, منظف مساحة, حذف الصور المكررة, ضغط الفيديو">
  <meta name="author" content="CleanSpace">
  <meta name="theme-color" content="#F4F5F2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F1219" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="index, follow">

  <!-- Fallback head tags for non-rendering clients; SeoService overwrites these
       per locale at render time. Canonical host lives in environment.siteUrl. -->
  <link rel="canonical" href="https://cleaningspace.app/">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CleanSpace">
  <meta property="og:title" content="CleanSpace — Free up your space in seconds">
  <meta property="og:description" content="Find duplicate & similar photos, compress videos, and tidy your library — all processed entirely on your device. Private by design.">
  <meta property="og:url" content="https://cleaningspace.app/">

  <meta property="og:locale" content="en_US">
  <meta property="og:locale:alternate" content="ar_AR">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="CleanSpace — Free up your space in seconds">
  <meta name="twitter:description" content="Find duplicate & similar photos, compress videos, and tidy your library — all on-device. Private by design.">
  <meta name="twitter:image" content="https://cleaningspace.app/og-image.png?v=6">

  <!-- Apple / PWA -->
